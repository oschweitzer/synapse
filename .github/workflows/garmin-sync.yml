# Synchro Garmin → synapse.garmin_* (voir jobs/garmin/sync.py et README).
#
# Les jetons de session Garmin passent d'un passage à l'autre par le cache
# Actions, chiffrés avec GARMIN_TOKEN_KEY : le job ne se reconnecte avec le mot
# de passe que s'ils sont absents ou refusés, Garmin bloquant les connexions
# répétées. Une entrée de cache n'est pas modifiable : on en écrit une nouvelle
# (clé unique) seulement quand les jetons ont changé, et la restauration prend
# la plus récente.

name: Garmin sync

on:
  schedule:
    # Toutes les 3 h, à une minute peu chargée.
    - cron: '17 */3 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: Jours relus (1 à 90 ; 30 pour amorcer l'historique)
        default: '3'

# Deux passages simultanés se disputeraient les jetons.
concurrency:
  group: garmin-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GARMIN_TOKEN_KEY: ${{ secrets.GARMIN_TOKEN_KEY }}
      TOKENS_ENC: garmin-tokens.enc
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: jobs/garmin/requirements.txt

      - run: pip install -r jobs/garmin/requirements.txt

      - name: Restaurer les jetons chiffrés
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.TOKENS_ENC }}
          key: garmin-tokens-${{ github.run_id }}
          restore-keys: garmin-tokens-

      - name: Déchiffrer les jetons
        id: tokens
        run: |
          if [ -z "$GARMIN_TOKEN_KEY" ]; then
            echo "::error::Secret GARMIN_TOKEN_KEY manquant"; exit 1
          fi
          dir="$RUNNER_TEMP/garmin-tokens"
          mkdir -m 700 -p "$dir"
          if [ -f "$TOKENS_ENC" ]; then
            if ! openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:GARMIN_TOKEN_KEY \
                -in "$TOKENS_ENC" -out "$dir/garmin_tokens.json"; then
              # Clé changée : on repart d'une connexion par mot de passe.
              echo "::warning::Jetons en cache illisibles, reconnexion par mot de passe"
              rm -f "$dir/garmin_tokens.json"
            fi
          fi
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "hash=$(sha256sum "$dir/garmin_tokens.json" 2>/dev/null | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Synchroniser
        run: python jobs/garmin/sync.py
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SYNAPSE_USER_ID: ${{ secrets.SYNAPSE_USER_ID }}
          GARMIN_TOKENSTORE: ${{ steps.tokens.outputs.dir }}
          GARMIN_SYNC_DAYS: ${{ inputs.days || '3' }}

      # Même après un échec : une connexion réussie avant l'erreur a produit des jetons.
      - name: Chiffrer les jetons s'ils ont changé
        id: encrypt
        if: always() && steps.tokens.outcome == 'success'
        run: |
          file="${{ steps.tokens.outputs.dir }}/garmin_tokens.json"
          [ -f "$file" ] || exit 0
          [ "$(sha256sum "$file" | cut -d' ' -f1)" != "${{ steps.tokens.outputs.hash }}" ] || exit 0
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:GARMIN_TOKEN_KEY \
            -in "$file" -out "$TOKENS_ENC"
          echo "save=true" >> "$GITHUB_OUTPUT"

      - name: Enregistrer les jetons chiffrés
        if: always() && steps.encrypt.outputs.save == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.TOKENS_ENC }}
          key: garmin-tokens-${{ github.run_id }}-${{ github.run_attempt }}
